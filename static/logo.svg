<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8ff00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon background -->
  <polygon points="100,8 180,52 180,148 100,192 20,148 20,52"
    fill="url(#darkGrad)" stroke="url(#limeGrad)" stroke-width="2.5"/>

  <!-- Inner accent ring -->
  <polygon points="100,20 168,58 168,142 100,180 32,142 32,58"
    fill="none" stroke="rgba(200,255,0,0.15)" stroke-width="1"/>

  <!-- Barbell horizontal bar -->
  <rect x="52" y="95" width="96" height="10" rx="5"
    fill="url(#limeGrad)" filter="url(#glow)"/>

  <!-- Left weight plate outer -->
  <rect x="38" y="76" width="18" height="48" rx="4"
    fill="url(#limeGrad)" filter="url(#glow)"/>

  <!-- Left weight plate inner (dark cutout) -->
  <rect x="42" y="82" width="10" height="36" rx="2"
    fill="#0a0a0a" opacity="0.5"/>

  <!-- Right weight plate outer -->
  <rect x="144" y="76" width="18" height="48" rx="4"
    fill="url(#limeGrad)" filter="url(#glow)"/>

  <!-- Right weight plate inner (dark cutout) -->
  <rect x="148" y="82" width="10" height="36" rx="2"
    fill="#0a0a0a" opacity="0.5"/>

  <!-- Left collar -->
  <rect x="56" y="88" width="10" height="24" rx="3"
    fill="#888"/>

  <!-- Right collar -->
  <rect x="134" y="88" width="10" height="24" rx="3"
    fill="#888"/>

  <!-- Upward arrow / progress mark above bar -->
  <polyline points="100,62 100,76" stroke="url(#limeGrad)" stroke-width="3"
    stroke-linecap="round" filter="url(#glow)"/>
  <polyline points="93,69 100,62 107,69" stroke="url(#limeGrad)" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Bottom line accent -->
  <line x1="72" y1="138" x2="128" y2="138"
    stroke="url(#limeGrad)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
